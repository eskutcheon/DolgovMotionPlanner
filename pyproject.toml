[build-system]
requires = ["setuptools>=68", "wheel"] #, "pybind11>=2.10", "numpy"]
build-backend = "setuptools.build_meta"

# TODO: add project metadata and copyright later

[project]
name = "dolgov-cbmp"
version = "0.1.0"
description = "Hybrid A* path planning (Dolgov et al.) with optional C++ kernel"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pillow", "pydantic>=2", "PyYAML>=6"]
readme = {file="README.md", content-type="text/markdown"}
license = "Apache-2.0"
license-files = ["LICENSE"]


[project.optional-dependencies]
cpp = ["pybind11>=2.10"] #, "hybrid-core @ file://./cpp_kernels/build/hybrid_core-0.1.0-cp310-cp310-win_amd64.whl"]
viz = ["mcap>=1.2.0", "foxglove-sdk>=0.16.0"]
dev = ["pytest>=7.0", "pybind11>=2.10"]

[project.scripts]
dolgov-planner = "dolgov_cbmp.__main__:main"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["dolgov_cbmp*"]